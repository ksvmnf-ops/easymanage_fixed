<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EasyManage Desktop</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8fafc; color: #172033; font-family: Arial, sans-serif; }
    main { width: min(680px, calc(100% - 48px)); padding: 36px; background: #fff; border: 1px solid #dbe3ef; border-radius: 18px; box-shadow: 0 16px 50px #17203314; }
    h1 { margin-top: 0; color: #1d4ed8; }
    code { direction: ltr; display: block; padding: 12px; background: #f1f5f9; border-radius: 8px; overflow-wrap: anywhere; }
    li { margin: 12px 0; line-height: 1.7; }
  </style>
</head>
<body>
  <main>
    <h1>EasyManage Desktop</h1>
    <p>لم يتم إعداد رابط تطبيق Google Apps Script بعد.</p>
    <ol>
      <li>انشر مشروع Google Apps Script كتطبيق ويب، واختر التشغيل بحساب مالك التطبيق.</li>
      <li>انسخ ملف <code>config.example.json</code> إلى <code>config.json</code>.</li>
      <li>ضع رابط النشر في الحقل <code>gasWebAppUrl</code>.</li>
      <li>شغّل التطبيق مجددًا أو أعد بناء ملف Windows.</li>
    </ol>
  </main>
</body>
</html>
